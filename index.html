<!DOCTYPE html>
<html>
<head>

    

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f5eeea;
        }

        .instruction {
            font-size: 18px;
            color: #555; /* gris clair */
            margin-top: 10px;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 40px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .projet {
            width: 400px;
            margin: 20px;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            color: #000000;
            background-color: white;
            transition: all 0.3s ease;
        }

        .pdfs {
            display: none;
            margin-bottom: 20px;
        }

        .pdfs a {
            display: inline-block;
            margin: 8px;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            color: #000000;
            background-color: #e8cfa7;
            font-weight: bold;
            transition: 0.3s;
        }


    </style>

    <script>
        function toggle(id) {
            var element = document.getElementById(id);
            if (element.style.display === "none") {
                element.style.display = "block";
            } else {
                element.style.display = "none";
            }
        }
    </script>

</head>

<body>

<p class="instruction">Cliquez sur une case pour obtenir plus d'information</p>

<div class="container">

    <div class="projet" onclick="toggle('projet1')">
        Planification énergétique sous incertitude ▼
    </div>

    <div id="projet1" class="pdfs">
        <a href="./files/TET4565_project.pdf" target="_blank">Sujet ▶</a>
        <a href="./files/TET4565___Group_14_PM_Optimization.pdf" target="_blank">Compte rendu ▶</a>
    </div>

    <div class="projet" onclick="toggle('projet2')">
        Conception et analyse d’une terminaison de câble haute tension ▼
    </div>

    <div id="projet2" class="pdfs">
        <a href="./files/prosjektbeskrivelse_engelsk.pdf" target="_blank">Sujet ▶</a>
        <a href="./files/HVIM_Project.pdf" target="_blank">Compte rendu ▶</a>
    </div>

</div>

</body>
</html>
